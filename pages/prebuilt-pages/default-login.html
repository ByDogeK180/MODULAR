<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SchoolCare</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons (para el ojito) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/LogoSchoolCare.png">
  <!-- Styles -->
  <link rel="stylesheet" href="../../assets/css/login.css">
</head>
<body>

  <div class="login-container">
    <img src="../../assets/img/LogoSchoolCare.png" alt="SchoolCare Logo" class="logo mb-3 img-fluid w-50">

    <h3 class="mb-3 fw-bold">¡Bienvenidos Padres de Familia!</h3>
    <p class="text-muted">La manera más fácil para manejar la vida estudiantil de tu hij@</p>
    <div id="mensajeAcceso" class="error-message mb-3"></div>

    <form id="loginForm" autocomplete="on">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Correo Electrónico:</label>
        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          placeholder="Ingresa tu correo"
          autocomplete="username"
          inputmode="email"
          autocapitalize="none"
          spellcheck="false"
          required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Contraseña:</label>

        <!-- Campo de contraseña con ojito -->
        <div class="input-group password-group">
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
            required>
          <button
            type="button"
            class="btn btn-outline-secondary toggle-password"
            aria-label="Mostrar contraseña"
            aria-pressed="false"
            tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>

      <div id="errorMessage" class="error-message"></div>

      <div class="text-center mb-3">
        <a href="#" class="forgot-link d-inline-block" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <button class="btn btn-primary w-100" type="submit">Ingresar</button>
    </form>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center">
          <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal"></button>
          <h4 class="mb-3 fw-bold">¿Contraseña olvidada?</h4>
          <p class="text-muted">Ingresa tu correo para resetear tu contraseña:</p>

          <form id="forgotPasswordForm" autocomplete="on">
            <div class="mb-3">
              <input
                type="email"
                class="form-control"
                id="forgotEmail"
                name="email"
                placeholder="juan@ejemplo.com"
                autocomplete="email"
                inputmode="email"
                autocapitalize="none"
                spellcheck="false"
                required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Resetear Contraseña</button>
          </form>

          <div id="forgotMessage" class="mt-2 text-danger"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toasts (debe estar en el DOM antes de ejecutar JS) -->
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toastArea" style="z-index: 2000"></div>

  <!-- JS libs -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- App JS -->
  <script src="../scripts/login.js"></script>
</body>
</html>
